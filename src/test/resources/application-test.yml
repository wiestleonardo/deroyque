spring:
  datasource:
    # Um banco por contexto Spring: contextos em cache (com worker ligado) não interferem entre si.
    url: jdbc:h2:mem:activation-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:

app:
  worker:
    enabled: false
