#Database - um banco por contexto Spring para contextos em cache nao interferirem entre si
spring.datasource.url=jdbc:h2:mem:activation-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

#JPA/Hibernate - confere entidade x schema do Liquibase a cada build
spring.jpa.hibernate.ddl-auto=validate

#Seguranca
spring.security.oauth2.resourceserver.jwt.issuer-uri=

#HTTP Client - provedor de ativacao
intercomm.provedor-ativacao.url-base=http://localhost:8089

#Processamento
processamento.job.habilitado=false
