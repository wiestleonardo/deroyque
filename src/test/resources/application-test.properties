#Database - one database per Spring context so cached contexts do not interfere with each other
spring.datasource.url=jdbc:h2:mem:activation-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

#JPA/Hibernate - checks entity against the Liquibase schema on every build
spring.jpa.hibernate.ddl-auto=validate

#Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=

#HTTP Client - activation provider
intercomm.activation-provider.base-url=http://localhost:8089

#Processing
processing.job.enabled=false
