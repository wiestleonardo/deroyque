#Aplicacao
spring.application.name=activation-service
spring.threads.virtual.enabled=true

#Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.connection-timeout=3000

#Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

#JPA/Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#Jackson - datas da API sempre em UTC (ISO-8601), independente do fuso do container
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

#Seguranca
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:activation-service}

#Servidor
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-stacktrace=never
server.error.include-message=never

#Log
logging.pattern.level=%5p [%X{correlationId:-}]
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

#HTTP Client - provedor de ativacao
intercomm.provedor-ativacao.url-base=${PROVIDER_BASE_URL}
intercomm.provedor-ativacao.tempo-limite-conexao=${PROVIDER_CONNECT_TIMEOUT:2s}
intercomm.provedor-ativacao.tempo-limite-leitura=${PROVIDER_READ_TIMEOUT:3s}
intercomm.provedor-ativacao.chave-api=${PROVIDER_API_KEY:}

#Processamento
processamento.quantidade-maxima-tentativa=5
processamento.tempo-reserva=30s
processamento.espera-inicial=2s
processamento.espera-maxima=5m
processamento.tamanho-lote=20
processamento.job.habilitado=${PROCESSING_JOB_ENABLED:true}
processamento.job.intervalo=1s

#Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=${spring.application.name}
