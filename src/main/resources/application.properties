#Application
spring.application.name=activation-service
spring.threads.virtual.enabled=true

#Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.connection-timeout=3000

#Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

#JPA/Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#Jackson - API dates are always UTC (ISO-8601), regardless of the container time zone
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

#Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:activation-service}

#Server
spring.web.locale=en
spring.web.locale-resolver=fixed
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-stacktrace=never
server.error.include-message=never

#Log
logging.pattern.correlation=[%X{correlationId:-}]
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

#HTTP Client - activation provider
intercomm.activation-provider.base-url=${PROVIDER_BASE_URL}
intercomm.activation-provider.connect-timeout=${PROVIDER_CONNECT_TIMEOUT:2s}
intercomm.activation-provider.read-timeout=${PROVIDER_READ_TIMEOUT:3s}
intercomm.activation-provider.api-key=${PROVIDER_API_KEY:}

#Processing
processing.max-attempts=5
processing.lease-duration=30s
processing.initial-backoff=2s
processing.max-backoff=5m
processing.batch-size=20
processing.job.enabled=${PROCESSING_JOB_ENABLED:true}
processing.job.interval=1s

#Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=${spring.application.name}
