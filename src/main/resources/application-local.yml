# Perfil para rodar sem nenhuma dependência externa: H2 em memória, provedor simulado na própria
# aplicação e emissor de tokens de teste. NUNCA habilitar em produção.
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:activation;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

app:
  local-dev:
    enabled: true
    jwt-secret: ${LOCAL_JWT_SECRET:local-dev-secret-only-for-tests-0123456789}
  provider:
    base-url: ${PROVIDER_BASE_URL:http://localhost:${server.port:8080}}
