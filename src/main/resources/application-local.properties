#Database - H2 em memoria quando DB_URL nao for informado
spring.datasource.url=${DB_URL:jdbc:h2:mem:activation;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

#Local-dev - emissor de token de teste; nunca habilitar fora do ambiente local
local-dev.habilitado=true
local-dev.segredo-jwt=${LOCAL_JWT_SECRET:}

#HTTP Client - mock do provedor (WireMock do docker compose) quando PROVIDER_BASE_URL nao for informado
intercomm.provedor-ativacao.url-base=${PROVIDER_BASE_URL:http://localhost:8089}
