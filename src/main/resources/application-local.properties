#Database - in-memory H2 when DB_URL is not set
spring.datasource.url=${DB_URL:jdbc:h2:mem:activation;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

#Local-dev - test token issuer and fake provider; never enable outside a local environment
local-dev.enabled=true
local-dev.jwt-secret=${LOCAL_JWT_SECRET:}

#HTTP Client - fake provider inside the application when PROVIDER_BASE_URL is not set
intercomm.activation-provider.base-url=${PROVIDER_BASE_URL:http://localhost:${server.port:8080}}
