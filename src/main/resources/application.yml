spring:
  application:
    name: activation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/activation}
    username: ${DB_USERNAME:activation}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          # Em produção as chaves públicas vêm do JWKS do emissor (descoberto via issuer-uri).
          issuer-uri: ${JWT_ISSUER_URI:}
          audiences: ${JWT_AUDIENCE:activation-service}

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    # Violação da constraint de externalId é um caminho esperado (corrida tratada no serviço);
    # erros SQL reais continuam chegando ao log pelas exceções propagadas.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF

app:
  http:
    max-request-size: 16KB
  provider:
    base-url: ${PROVIDER_BASE_URL:http://localhost:8089}
    connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:2s}
    read-timeout: ${PROVIDER_READ_TIMEOUT:3s}
    api-key: ${PROVIDER_API_KEY:}
  processing:
    max-attempts: 5
    lease: 30s
    initial-backoff: 2s
    max-backoff: 5m
    batch-size: 20
  worker:
    enabled: ${WORKER_ENABLED:true}
    poll-interval: 1s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
