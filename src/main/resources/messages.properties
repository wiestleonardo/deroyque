#Validation
validation.required=is required
validation.max-length=must have at most {max} characters
validation.identifier-format=must contain only letters, digits, '.', '_' or '-'

#Errors
error.validation.title=Invalid data
error.validation.detail=One or more fields failed validation.
error.invalid-status.title=Invalid data
error.invalid-status.detail=Invalid status. Accepted values: PENDING, PROCESSING, COMPLETED, FAILED.
error.request-not-found.title=Request not found
error.request-not-found.detail=No activation request was found with the given id.
error.duplicate-request.title=Duplicate request
error.duplicate-request.detail=The externalId ''{0}'' was already used by another request with a different customerId/productCode.
error.concurrent-modification.title=Concurrent modification
error.concurrent-modification.detail=The request was changed by another process. Please try again.
error.invalid-status-transition.title=Invalid status transition
error.invalid-status-transition.detail=Invalid status transition: {0} -> {1}.
error.unauthorized.title=Unauthorized
error.unauthorized.detail=Missing, invalid or expired token.
error.forbidden.title=Forbidden
error.forbidden.detail=The token does not have the scope required for this operation.
error.payload-too-large.title=Payload too large
error.payload-too-large.detail=The request body exceeds the allowed size.
error.internal.title=Internal error
error.internal.detail=An unexpected error occurred. Please send the traceId to support.
